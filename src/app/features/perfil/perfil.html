<div class="container my-4" style="max-width: 600px">
  <h2 class="fw-bold mb-1">
    <i class="bi bi-person-badge-fill text-primary me-2"></i>Perfil y Emergencia
  </h2>
  <p class="text-muted">Guarda tus datos clave de salud y contacto en caso de omitir tomas.</p>

  <div class="card card-custom p-4">
    @if (guardadoExitoso) {
      <div class="alert alert-success">¡Perfil guardado con éxito!</div>
    }

    <div class="mb-3">
      <label class="form-label fw-medium">Tu Nombre Completo</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="datos.nombre"
        placeholder="Ej. Juan Pérez"
      />
    </div>

    <div class="mb-3">
      <label class="form-label fw-medium">Alergias o Condiciones Conocidas</label>
      <textarea
        class="form-control"
        rows="2"
        [(ngModel)]="datos.alergias"
        placeholder="Ej. Alérgico a la Penicilina, Asma"
      ></textarea>
    </div>

    <hr />
    <h5 class="fw-bold text-danger">
      <i class="bi bi-telephone-fill me-2"></i>Contacto de Emergencia
    </h5>

    <div class="mb-3">
      <label class="form-label fw-medium">Nombre del Contacto</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="datos.contactoNombre"
        placeholder="Ej. Mamá / Tutor"
      />
    </div>

    <div class="mb-3">
      <label class="form-label fw-medium">Teléfono / WhatsApp</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="datos.contactoTelefono"
        placeholder="Ej. 4181234567"
      />
    </div>

    <button class="btn btn-primary w-100 py-2 mt-2" (click)="guardar()">Guardar Perfil</button>
  </div>
</div>
